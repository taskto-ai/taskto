name: Bug report
description: Something doesn't work as the docs say it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please don't include secrets: API keys, tokens, passwords, the setup token, or logs that contain them. A security vulnerability goes through the Security tab instead (SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The version `/healthz` reports (a tag or a commit SHA).
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How it runs
      options:
        - Docker Compose, published images
        - Docker Compose, built from source
        - The binary, without Docker
        - Development (make dev-server)
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Anything else
      description: The browser and OS for a web app issue, CLI worker mode, model provider, relevant log lines (with secrets removed).
