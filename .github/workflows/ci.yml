# CI for TaskTo.AI: the Go server, the web app and the agent runtime, plus a secret scan.
#
# Every job runs on a GitHub-hosted Ubuntu runner, which is a whole VM with Docker and
# passwordless sudo. Three jobs depend on that and won't run on a runner without it:
# - cli-isolation runs the isolation tests as root in a throwaway container;
# - worker-network needs privileged Docker: it starts a Docker-in-Docker host
#   (deploy/worker-network-test.sh, `docker run --privileged`) and sets its firewall;
# - gitleaks runs the scanner's container.
#
# Actions are pinned by commit SHA (the tag is in the comment); bump both together. No
# secrets: everything here runs on a fork's pull request too.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The merge queue builds each entry on a temporary gh-readonly-queue/main/... branch (the
  # pull request merged onto the latest main, and onto the entries ahead of it) and waits for
  # every required check on it, so every job here must run for this event too. No job reads
  # the pull_request event's fields (head_ref, base_ref), which are empty for a merge group.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (golangci-lint, Biome)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      # Pinned in tools/go.mod and verified against go.sum: no install script.
      - name: golangci-lint
        run: go tool -modfile=tools/go.mod golangci-lint run ./...
      # Docs and comments don't refer to anything outside the repository.
      - name: References
        run: go run .github/scripts/refguard.go
      # The host's updater runs as root on a VM (deploy/taskto-update.sh); its tests are
      # cmd/taskto/update_test.go, in the Go job.
      - name: shellcheck
        run: shellcheck -S warning deploy/taskto-update.sh deploy/safety-check.sh cmd/taskto/testdata/fake-docker
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install pnpm
        run: npm install -g "pnpm@$(node -p "require('./package.json').packageManager.split('@')[1].split('+')[0]")"
      - run: pnpm install --frozen-lockfile
      - name: Biome
        run: pnpm run lint

  go:
    name: Go (test, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # The JSON is kept (below) and read back by gotest-report, so a failure that happens
      # once in a while can be read afterwards: the log has each package's result and the
      # whole output of every failing test, a panic or a timeout included.
      - name: go test
        run: go test -json ./... > go-test.json
      - name: Test results
        if: ${{ !cancelled() }}
        run: |
          if [ -s go-test.json ]; then
            go run .github/scripts/gotest-report.go go-test.json
          else
            echo "go test wrote no JSON: its error is in the step above"
          fi
      - name: Keep go test's JSON
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-test-json
          path: go-test.json
          if-no-files-found: ignore
          retention-days: 30
      - run: go build -o "$RUNNER_TEMP/taskto" ./cmd/taskto

  js:
    name: Web + agent (typecheck, build, test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install pnpm
        # The version comes from `packageManager` in package.json, the single pin. Corepack
        # isn't used because Node 25+ no longer ships it.
        run: npm install -g "pnpm@$(node -p "require('./package.json').packageManager.split('@')[1].split('+')[0]")"
      - run: pnpm install --frozen-lockfile
      # Fails on a key missing from English or a broken translation; reports what each
      # language still shows in English (docs/i18n.md).
      - name: Translations
        run: pnpm --filter @taskto/web run i18n
      # Fails on a .tt- selector declared twice at the top level of the stylesheet, and on a
      # tt- class a component uses that no rule has (web/scripts/css-check.mjs).
      - name: Stylesheet
        run: pnpm --filter @taskto/web run css
      - run: pnpm run build
      # Each package's vitest also writes a JSON report, read back by vitest-report, so a
      # failure that happens once in a while can be read afterwards: the log ends with each
      # failing test's name and whole error, and the reports are kept.
      - name: Tests
        run: pnpm run test --reporter=default --reporter=json --outputFile.json=vitest-results.json
      - name: Test results
        if: ${{ !cancelled() }}
        run: |
          set -- */vitest-results.json
          if [ -e "$1" ]; then
            node .github/scripts/vitest-report.mjs "$@"
          else
            echo "vitest wrote no report: its error is in the steps above"
          fi
      - name: Keep vitest's reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-json
          path: "*/vitest-results.json"
          if-no-files-found: ignore
          retention-days: 30

  web-e2e:
    name: Web end to end (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install pnpm
        run: npm install -g "pnpm@$(node -p "require('./package.json').packageManager.split('@')[1].split('+')[0]")"
      - run: pnpm install --frozen-lockfile
      # The server with the web app built in, as the image has it (docs/web-e2e.md).
      - name: Build the server with the web app
        run: make build
      # The only download: Chromium, at the version of the pinned Playwright, and the system
      # libraries it needs. The tests start the server themselves, on a fresh data directory
      # each, with no agent runtime and no model.
      - name: Install Chromium
        run: pnpm --filter @taskto/web exec playwright install --with-deps chromium
      - name: Web end to end tests
        run: pnpm --filter @taskto/web run e2e
      # A failing scenario leaves its trace (a zip for `playwright show-trace`) and a screenshot.
      - name: Keep the traces and screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-e2e-results
          path: web/e2e-results
          if-no-files-found: ignore
          retention-days: 14

  agent-it:
    name: Agent runtime integration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install pnpm
        run: npm install -g "pnpm@$(node -p "require('./package.json').packageManager.split('@')[1].split('+')[0]")"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @taskto/agent build
      # Starts the real sidecar with the scripted offline model: no keys, no network. The
      # cmd/taskto test builds the server and kills it with SIGKILL to check the sidecar follows,
      # and adds a provider account through the API that the running sidecar must pick up.
      - run: TASKTO_AGENT_IT=1 go test -count=1 -v ./internal/agentrt/ ./internal/providers/ ./cmd/taskto/

  cli-isolation:
    name: CLI worker isolation (root, Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The container mode's OS boundary (internal/cliworker/isolation_test.go): the tests make
      # Unix users and run the fake CLIs as them, so they need root. They run in a throwaway
      # container, with the source piped in, and must actually run,
      # not skip.
      - name: Isolation tests as root
        run: |
          tar -c --exclude=.git --exclude=node_modules . | docker run -i --rm \
            golang:1.27.4-trixie@sha256:f18c3d73a184fb0582828510722e723b63a93f7188d11dd223d9be6f6880e65d \
            sh -c 'mkdir -p /w && tar -x -C /w && cd /w && go test -count=1 -v -run Isolation ./internal/cliworker/ > /tmp/out 2>&1; s=$?; cat /tmp/out; [ $s -eq 0 ] && grep -q -- "--- PASS: TestIsolationBetweenUsers" /tmp/out'

  worker-network:
    name: CLI worker network (Docker in Docker, root)
    # Needs privileged Docker: GitHub-hosted runners only.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # docs/cli-workers.md#the-workers-network: the real compose.yaml and the install's
      # deploy/worker-firewall.sh, in a throwaway privileged Docker-in-Docker host. From the
      # worker, as a CLI's user, the internet and the proxy answer; the server, Ollama, the host
      # and a machine on its LAN don't, while the same listeners answer from elsewhere.
      - name: The worker reaches the internet and the proxy, nothing else
        run: |
          CGO_ENABLED=0 GOOS=linux go build -o "$RUNNER_TEMP/taskto" ./cmd/taskto
          s=0
          sh deploy/worker-network-test.sh "$RUNNER_TEMP/taskto" > "$RUNNER_TEMP/worker-network.out" 2>&1 || s=$?
          cat "$RUNNER_TEMP/worker-network.out"
          [ $s -eq 0 ] && grep -q '^worker-network-test: OK$' "$RUNNER_TEMP/worker-network.out"

  backup-it:
    name: Append-only backup and restore
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # The real restic and rest-server, release binaries checked against the sha256 sums
      # pinned here (from each release's SHA256SUMS). restic is the version compose.yaml's
      # backup image has; bump them together.
      - name: Install restic and rest-server
        run: |
          set -eu
          case "$(uname -m)" in
            x86_64) arch=amd64
              restic_sha=f415415624dcc452f2a02b8c33641791a8c6d6d3b65bbb3543fcf9a25151585c
              rest_sha=4c9c95bc079a0334e81fad379b19dc5c3353c71c2c88d652cafce2081c2b1c66 ;;
            aarch64|arm64) arch=arm64
              restic_sha=a5f64aaab53d51e311fa3829124c5b703f2d14cf187d8640b6be3b2b49376465
              rest_sha=cef139cbe8b27b16bda731d17f093b0aa466b8c60b136c12d78b6f2bff3daf22 ;;
            *) echo "no pinned binaries for $(uname -m)"; exit 1 ;;
          esac
          dl="$RUNNER_TEMP/backup-tools"; mkdir -p "$dl/bin"; cd "$dl"
          curl -fsSL --retry 3 --retry-all-errors -o restic.bz2 "https://github.com/restic/restic/releases/download/v0.19.1/restic_0.19.1_linux_${arch}.bz2"
          curl -fsSL --retry 3 --retry-all-errors -o rest-server.tar.gz "https://github.com/restic/rest-server/releases/download/v0.14.0/rest-server_0.14.0_linux_${arch}.tar.gz"
          printf '%s  restic.bz2\n%s  rest-server.tar.gz\n' "$restic_sha" "$rest_sha" | sha256sum -c -
          bzip2 -dc restic.bz2 > bin/restic
          tar -xzf rest-server.tar.gz --strip-components=1 -C bin "rest-server_0.14.0_linux_${arch}/rest-server"
          chmod 755 bin/restic bin/rest-server
          echo "$dl/bin" >> "$GITHUB_PATH"
      # Backs up a running server through rest-server --append-only, checks the server's user
      # can't delete, runs the nightly schedule's backup (`taskto backup-schedule -now`) and
      # checks its status, and that it stops early and leaves nothing behind when the backup
      # host is down, restores into a server that starts, and prunes as the backup host does.
      - run: TASKTO_BACKUP_IT=1 go test -count=1 -v -run TestAppendOnlyBackupAndRestore ./cmd/taskto/

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: gitleaks scans commits, so a secret committed and later removed
          # is still reported. The queue's gh-readonly-queue/main/... branches come along
          # with the other branches; they share main's history, so each commit is scanned
          # once and the extra cost is the few commits of the entries being merged.
          fetch-depth: 0
      - name: Gitleaks
        # Pinned by tag and digest (multi-arch index) so an upstream change can't alter or
        # compromise the scan. Bump both together.
        # The rules are .gitleaks.toml's. The source, .git included, is piped in (and so
        # owned by the container's user, which git requires). The job
        # fails unless commits were actually scanned.
        run: |
          tar -c . | docker run -i --rm --entrypoint sh \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            -c 'mkdir /tmp/repo && tar -x -C /tmp/repo && cd /tmp/repo && git config --global --add safe.directory /tmp/repo \
              && { s=0; gitleaks detect --redact --no-banner --no-color --exit-code 1 --source . > /tmp/out 2>&1 || s=$?; cat /tmp/out; \
                   [ $s -eq 0 ] && grep -Eq "[1-9][0-9]* commits scanned" /tmp/out; }'
