# Cuts a release (docs/releasing.md): run it by hand from main with a version. It checks the
# version is vMAJOR.MINOR.PATCH and newer than the last release, and that CI passed on
# main's head; tags that commit, creates the GitHub Release (with its notes, and the
# `manual-upgrade: true` line when it needs a person, from the moment it is published), and
# starts the Images workflow on the tag, which publishes ghcr.io/<owner>/taskto*:<tag>. Servers
# on the release channel (docs/install.md#automatic-updates) take it once those images exist.
#
# The tag is made by pushing the commit CI passed on to refs/tags/<version>. A push of a tag
# that exists is refused when it is at another commit, but succeeds when it is at this very
# one, so the tag is first looked for through the API, right before the push, and the run
# stops if it is there. The release is then created with --verify-tag, so it can only be for
# that tag. The version is vMAJOR.MINOR.PATCH of at most 100 characters, as the updater
# (deploy/taskto-update.sh) reads one. The inputs reach shell commands only as environment
# variables, never in the command line itself.
#
# Only the workflow's own GITHUB_TOKEN, on a GitHub-hosted runner. A tag made with that token
# doesn't start other workflows, which is why the Images workflow is started here by name.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version, vMAJOR.MINOR.PATCH, newer than the last release"
        required: true
        type: string
      manual_upgrade:
        description: "This release needs a person: servers don't install it by themselves (put what to do in the notes)"
        required: false
        type: boolean
        default: false
      notes:
        description: "Notes to put first (what a person running a server should know; required with manual_upgrade)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release

jobs:
  release:
    name: Tag main, create the release, publish its images
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the tag and the release
      actions: write # to start the Images workflow on the tag
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ inputs.version }}
      MANUAL_UPGRADE: ${{ inputs.manual_upgrade }}
      NOTES: ${{ inputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check the version and that CI passed
        run: |
          fail() { echo "::error::$*"; exit 1; }
          printf '%s' "$VERSION" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' && [ "${#VERSION}" -le 100 ] || fail "'$VERSION' isn't vMAJOR.MINOR.PATCH of at most 100 characters"
          last=$(git tag -l 'v*' | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sort -V | tail -n 1 || true)
          if [ -n "$last" ]; then
            [ "$VERSION" != "$last" ] && [ "$(printf '%s\n%s\n' "$last" "$VERSION" | sort -V | tail -n 1)" = "$VERSION" ] \
              || fail "$VERSION isn't newer than the last release, $last"
          fi
          git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null && fail "the tag $VERSION exists"
          # The marker is the workflow's to add, from the input, never from the notes.
          if printf '%s\n' "$NOTES" | grep -Eiq '^manual-upgrade:'; then
            fail "the notes have a manual-upgrade line: tick manual_upgrade instead"
          fi
          if [ "$MANUAL_UPGRADE" = true ] && [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            fail "a release that needs a person needs notes saying what to do"
          fi
          passed=$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&status=success" --jq '.total_count')
          [ "$passed" -ge 1 ] || fail "CI hasn't passed on main's head, $GITHUB_SHA: wait for it, or fix it"
      - name: Tag the commit CI passed on
        run: |
          # Right before the push: a push of an existing tag at this same commit would succeed.
          if out=$(gh api "repos/$GH_REPO/git/ref/tags/$VERSION" 2>&1); then
            echo "::error::the tag $VERSION exists"
            exit 1
          elif ! printf '%s' "$out" | grep -q 'HTTP 404'; then
            echo "::error::can't tell whether the tag $VERSION exists: $out"
            exit 1
          fi
          # A tag made between the check and the push, at another commit, is refused by the push.
          git push origin "$GITHUB_SHA:refs/tags/$VERSION"
      - name: Create the release, and publish its images
        run: |
          # The notes are complete when the release is published: servers read the marker the
          # moment they can see the release.
          : >"$RUNNER_TEMP/notes.md"
          if [ "$MANUAL_UPGRADE" = true ]; then
            printf 'manual-upgrade: true\n\n' >>"$RUNNER_TEMP/notes.md"
          fi
          if [ -n "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            printf '%s\n\n' "$NOTES" >>"$RUNNER_TEMP/notes.md"
          fi
          if [ "$MANUAL_UPGRADE" = true ]; then
            gh release create "$VERSION" --verify-tag --title "$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$VERSION" --verify-tag --title "$VERSION" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
          fi
          gh workflow run images.yml --ref "$VERSION"
