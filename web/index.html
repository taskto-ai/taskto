<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: the app lays itself out inside the safe areas (notch, home bar).
         interactive-widget=resizes-content: on Android the on-screen keyboard shrinks the page, so the
         composer stays above it. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <!-- The cascade layers' order, before any stylesheet: the first @layer the browser meets fixes
         that layer's place, and a production build links the stylesheets of shared chunks (a
         component's `@layer components`) before the entry's, which holds src/ui/index.css. The same
         statement opens src/ui/index.css; src/ui/tokens.test.ts keeps the two equal. -->
    <style>
      @layer tokens, themes, base, components, screens;
    </style>
    <meta name="theme-color" content="#faf8f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Added to the Home Screen on iOS, it opens like an app. The top bar is light, so the status bar is
         the default one (dark text on light), not black-translucent, whose white text it would hide. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="taskto" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>taskto.ai</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
