# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit's pull request reviews (free for public repositories). Reviews are in English,
# like the code and docs; translations are reviewed too, lock files aren't.
# CodeRabbit reviews a pull request when it opens, and again only when someone comments
# `@coderabbitai review`: a push, such as moving the branch onto a newer main, doesn't start
# another review, whose new threads would block merging (conversations must be resolved).
# A draft pull request isn't reviewed when it opens (`drafts: false`); comment
# `@coderabbitai review` to request a review of one.
language: en-US
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  path_filters:
    - "!pnpm-lock.yaml"
    - "!go.sum"
    - "!tools/go.sum"
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: false
chat:
  auto_reply: true
